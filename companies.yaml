# --------------------------------------------------------------------------
# SmartRecruiters-hosted career sites
# --------------------------------------------------------------------------
# Public, unauthenticated API:
#   GET https://api.smartrecruiters.com/v1/companies/{company}/postings
# {company} is SmartRecruiters' internal company identifier, NOT always the
# jobs.smartrecruiters.com/{slug} web slug — the API returns 200 + empty list
# for unknown identifiers, so typos fail silently (the scraper logs a warning).
# Entries can be plain identifiers, or mappings when the web slug differs:
#   smartrecruiters:
#     - somecompany
#     - {id: "ABC123", slug: "some-company", name: "Some Company Inc."}
# A fetch_smartrecruiters() implementation ships with scraper.py — apply
# smartrecruiters-fetcher.patch from ~/workspace/your_files/ if the repo
# doesn't have it yet.
smartrecruiters: []

# --------------------------------------------------------------------------
# Radancy (TalentBrew)-hosted career sites
# --------------------------------------------------------------------------
# Radancy (formerly TMP Worldwide / TalentBrew) powers corporate career sites
# like jobs.paloaltonetworks.com and jobs.citi.com. The search page is a JS
# shell; the scraper POSTs a JSON criteria object to the site's own public,
# unauthenticated endpoint:
#   POST {base}/{locale}/search-jobs/resultspost
# Job cards carry no posted date, so the fetcher loads each title-matched
# job's detail page and reads the JSON-LD datePosted + description (one extra
# request per match — that's also what feeds h1b/years enrichment).
# Entries are base URLs (locale defaults to "en"), or mappings:
#   radancy:
#     - https://jobs.paloaltonetworks.com
#     - {base: "https://jobs.example.com", locale: "en", name: "Example Inc."}
# A fetch_radancy() implementation ships with scraper.py — apply
# radancy-fetcher.patch from ~/workspace/your_files/ if the repo
# doesn't have it yet (apply smartrecruiters-fetcher.patch first —
# radancy-fetcher.patch is layered on top of it).
radancy:
  # Added 2026-09-27: Palo Alto Networks (migrated off SmartRecruiters to
  # Radancy; old SmartRecruiters board is stale). Verified live — 1,383 open
  # reqs, cards + JSON-LD datePosted parse correctly.
  - {base: "https://jobs.paloaltonetworks.com", locale: "en", name: "Palo Alto Networks"}

# --------------------------------------------------------------------------
# Workday-hosted career sites
# --------------------------------------------------------------------------
# Microsoft, Salesforce, and a large share of Fortune 500s run on Workday
# rather than Greenhouse/Lever/Ashby. Paste the exact myworkdayjobs.com URL
# from your browser after clicking into a company's "Careers"/"Search jobs"
# page — this is the public search endpoint the career site itself calls,
# no login needed. (This is not an official/documented Workday API — it's
# the same page-rendering endpoint every Workday careers site uses.)
#
# NOTE: unlike Greenhouse/Lever, Workday's list endpoint doesn't return full
# description text, so h1b_sponsor/years_min/years_max default to "unknown"
# for these jobs unless the company is also in h1b.known_sponsors above.
workday:
  - https://salesforce.wd12.myworkdayjobs.com/External_Career_Site

# Cap on jobs fetched per Workday tenant per run — some run 1,000+ open
# reqs, this keeps the daily run fast. Raise for deeper coverage.
workday_max_jobs_per_tenant: 200

# SAP is NOT included above: jobs.sap.com runs on SAP's own SuccessFactors
# platform, and there's no verified public no-auth JSON endpoint for it the
# way there is for Greenhouse/Lever/Ashby/Workday. If you find one (open
# SAP's careers page, DevTools -> Network tab, search a role, look for an
# XHR request returning JSON), it can likely be added as a new source.

# Free-text keywords used everywhere (HN, RemoteOK, and to tag/categorize
# roles pulled from the companies above). Edit freely.
seniority_keywords:
  - senior
  - staff
  - principal
  - lead
  - "sr."
  - "sr "
  - iv
  - v
  - "l5"
  - "l6"

exclude_keywords:
  - intern
  - "new grad"
  - graduate
  - junior
  - entry level

# --------------------------------------------------------------------------
# H1B sponsorship filter
# --------------------------------------------------------------------------
# No job-board API exposes a structured "sponsors visas" field, so this is
# necessarily a best-effort heuristic, built two ways:
#
#  1. Text detection: each posting's actual description is scanned for
#     explicit sponsorship language (see keyword lists in scripts/scraper.py
#     if you want to tune them) and tagged h1b_sponsor: yes / no / unknown.
#  2. known_sponsors: a list you maintain yourself of companies with a history
#     of sponsoring H1Bs. Seed it from the official, public USCIS H-1B
#     Employer Data Hub (search by employer, no login needed):
#     https://www.uscis.gov/tools/reports-and-studies/h-1b-employer-data-hub
#     A prior approval doesn't guarantee they're sponsoring for THIS role —
#     treat this list as a signal, not a guarantee.
h1b:
  enabled: true

  # off               -> just tag every job, don't drop anything
  # exclude_no        -> drop jobs whose description explicitly says no
  #                      sponsorship; keep "yes" and "unknown"
  # known_sponsors_only -> keep only jobs where the company is in
  #                      known_sponsors below, OR the description explicitly
  #                      says yes. Strictest option, will drop the most jobs.
  mode: exclude_no

  known_sponsors:
    - google
    - amazon
    - microsoft
    - meta
    - apple
    - nvidia
    - salesforce
    - airbnb
    - doordash
    - coinbase
    - databricks
    - stripe
    # Add more — match against the "company" field however it shows up
    # (case-insensitive substring match), e.g. from Greenhouse/Lever/Ashby
    # slugs or RemoteOK/HN company names.

# --------------------------------------------------------------------------
# Years-of-experience feeds
# --------------------------------------------------------------------------
# Every job is tagged with years_min/years_max by parsing phrases like
# "5+ years", "3-5 years of experience", "minimum 8 years" out of the actual
# posting text. Many postings state no number at all — those are tagged
# years_min: null, years_max: null (unknown), not forced into a bucket.
#
# keep_unknown_years: true  -> unknown-experience postings appear in every
#                               feed below (recommended default: many good,
#                               relevant roles just don't state a number)
# keep_unknown_years: false -> unknown-experience postings are dropped from
#                               every feed below except "all" at the repo root
keep_unknown_years: true

# Add/remove/edit freely — one full feed is generated per entry, at
# feeds/<slug>/README.md, feeds/<slug>/feed.json, feeds/<slug>/feed.xml.
# max_years: null means "and up" (no upper bound).
# A job matches a feed if its detected range OVERLAPS [min_years, max_years]
# at all — e.g. a posting saying "3+ years" overlaps both the 3-5 and 6-9
# feeds below, since "3+" could mean anything from 3 up.
# The unfiltered combined feed (every level) is always generated too, at the
# repo root: README.md, feed.json, feed.xml.
feeds:
  - slug: entry
    label: "0-2 years"
    min_years: 0
    max_years: 2
  - slug: mid
    label: "3-5 years"
    min_years: 3
    max_years: 5
  - slug: senior
    label: "6-9 years"
    min_years: 6
    max_years: 9
  - slug: staff-plus
    label: "10+ years"
    min_years: 10
    max_years: null
