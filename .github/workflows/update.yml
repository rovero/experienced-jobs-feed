name: Update job feed

on:
  schedule:
    # Runs daily at 13:00 UTC. Edit as you like (cron syntax).
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch listings
        run: python scripts/scraper.py

      - name: Render README
        run: python scripts/generate_readme.py

      - name: Build agent-consumable feeds
        run: python scripts/generate_feed.py

      - name: Commit changes if any
        run: |
          git config user.name "job-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add listings.json README.md feed.json feed.xml
          git diff --cached --quiet || git commit -m "Update job feed [automated]"
          git push
